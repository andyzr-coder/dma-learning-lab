<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" width="1400" height="1080" role="img"><title>全加器：同一进位功能，关键路径可以不同</title><desc>左图共享XOR的p信号给sum和carry，carry关键路径XOR-AND-OR为4时间单位。右图三个AND接三输入OR实现多数函数carry，路径2时间单位。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="1080" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1400" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">全加器：同一进位功能，关键路径可以不同</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">模型：XOR 延迟 2；AND、OR 延迟 1；输入同时到达，忽略导线，右图允许三输入 OR。</text><text x="350" y="130" dominant-baseline="text-before-edge" text-anchor="middle" font-size="28" font-weight="700" fill="#172b3a">方案 A：共享 p = a XOR b</text><text x="1050" y="130" dominant-baseline="text-before-edge" text-anchor="middle" font-size="28" font-weight="700" fill="#172b3a">方案 B：多数函数 carry</text><polyline points="700,115 700,735" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><rect x="180" y="240" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="227.5" y="255" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">XOR</text><text x="227.5" y="288" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="470" y="195" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="517.5" y="210" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">XOR</text><text x="517.5" y="243" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="55" y="235" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><text x="55" y="295" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><polyline points="80,255 180,255" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="180,255 170.0,250.0 170.0,260.0" fill="#172b3a"/><polyline points="80,305 180,305" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="180,305 170.0,300.0 170.0,310.0" fill="#172b3a"/><polyline points="275,280 350,280 350,215 470,215" fill="none" stroke="#3169b3" stroke-width="4" stroke-linejoin="round" /><polygon points="470,215 460.0,210.0 460.0,220.0" fill="#3169b3"/><text x="305" y="235" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#3169b3">p</text><polyline points="565,235 650,235" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="650,235 640.0,230.0 640.0,240.0" fill="#172b3a"/><text x="590" y="190" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">s</text><text x="365" y="300" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">cin</text><polyline points="415,330 440,330 440,255 470,255" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="470,255 460.0,250.0 460.0,260.0" fill="#172b3a"/><rect x="390" y="390" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="437.5" y="405" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="437.5" y="438" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="160" y="555" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="207.5" y="570" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="207.5" y="603" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="555" y="500" width="95" height="90" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="602.5" y="515" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="602.5" y="548" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><circle cx="350" cy="280" r="5" fill="#3169b3" stroke="#3169b3" stroke-width="2"/><polyline points="350,280 350,410 390,410" fill="none" stroke="#3169b3" stroke-width="4" stroke-linejoin="round" /><polygon points="390,410 380.0,405.0 380.0,415.0" fill="#3169b3"/><text x="205" y="445" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">cin</text><polyline points="260,460 390,450" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="390,450 379.6459726505605,445.78169256133947 380.41293763940786,455.75223741635523" fill="#172b3a"/><text x="45" y="555" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><text x="45" y="615" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><polyline points="80,575 160,575" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="160,575 150.0,570.0 150.0,580.0" fill="#172b3a"/><polyline points="80,625 160,625" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="160,625 150.0,620.0 150.0,630.0" fill="#172b3a"/><polyline points="485,430 520,430 520,520 555,520" fill="none" stroke="#3169b3" stroke-width="4" stroke-linejoin="round" /><polygon points="555,520 545.0,515.0 545.0,525.0" fill="#3169b3"/><polyline points="255,595 420,595 420,570 555,570" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="555,570 545.0,565.0 545.0,575.0" fill="#172b3a"/><polyline points="650,545 680,545" fill="none" stroke="#3169b3" stroke-width="4" stroke-linejoin="round" /><polygon points="680,545 670.0,540.0 670.0,550.0" fill="#3169b3"/><text x="560" y="635" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">cout = ab + p·cin</text><rect x="900" y="220" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="947.5" y="235" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="947.5" y="268" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="775" y="228" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><polyline points="825,240 900,240" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="900,240 890.0,235.0 890.0,245.0" fill="#172b3a"/><text x="775" y="273" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><polyline points="825,285 900,285" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="900,285 890.0,280.0 890.0,290.0" fill="#172b3a"/><rect x="900" y="380" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="947.5" y="395" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="947.5" y="428" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="775" y="388" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><polyline points="825,400 900,400" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="900,400 890.0,395.0 890.0,405.0" fill="#172b3a"/><text x="775" y="433" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">cin</text><polyline points="825,445 900,445" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="900,445 890.0,440.0 890.0,450.0" fill="#172b3a"/><rect x="900" y="540" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="947.5" y="555" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="947.5" y="588" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="775" y="548" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><polyline points="825,560 900,560" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="900,560 890.0,555.0 890.0,565.0" fill="#172b3a"/><text x="775" y="593" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">cin</text><polyline points="825,605 900,605" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="900,605 890.0,600.0 890.0,610.0" fill="#172b3a"/><rect x="1190" y="360" width="100" height="140" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="1240.0" y="375" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="1240.0" y="408" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="1240" y="450" dominant-baseline="text-before-edge" text-anchor="middle" font-size="17" font-weight="400" fill="#172b3a">3 输入</text><polyline points="995,260 1080,260 1080,385 1190,385" fill="none" stroke="#23734c" stroke-width="4" stroke-linejoin="round" /><polygon points="1190,385 1180.0,380.0 1180.0,390.0" fill="#23734c"/><polyline points="995,420 1190,420" fill="none" stroke="#23734c" stroke-width="4" stroke-linejoin="round" /><polygon points="1190,420 1180.0,415.0 1180.0,425.0" fill="#23734c"/><polyline points="995,580 1080,580 1080,470 1190,470" fill="none" stroke="#23734c" stroke-width="4" stroke-linejoin="round" /><polygon points="1190,470 1180.0,465.0 1180.0,475.0" fill="#23734c"/><polyline points="1290,430 1360,430" fill="none" stroke="#23734c" stroke-width="4" stroke-linejoin="round" /><polygon points="1360,430 1350.0,425.0 1350.0,435.0" fill="#23734c"/><text x="1300" y="380" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#172b3a">cout</text><text x="1050" y="665" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">cout = ab + a·cin + b·cin</text><rect x="55" y="760" width="625" height="150" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="367.5" y="776" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">A 的 carry 最长路径：2+1+1 = 4</text><text x="73" y="817.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">蓝色路径：a/b → XOR → AND → OR。</text><text x="73" y="847.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">sum 已需要 p，carry 共享它可能节约逻辑。</text><text x="73" y="877.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">但共享会让 carry 等待 p 生成。</text><rect x="735" y="760" width="610" height="150" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="1040.0" y="776" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">B 的 carry 最长路径：1+1 = 2</text><text x="753" y="817.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">绿色路径：任意输入 → AND → 三输入 OR。</text><text x="753" y="847.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">这里只比较 carry；sum 仍必须实现。</text><text x="753" y="877.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">若只允许二输入 OR，最坏路径要重算。</text><text x="65" y="955" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#172b3a">功能核验：对全部 8 个输入，应满足整数等式 a+b+cin = s+2·cout；不要把整数 + 当布尔 OR。</text><polyline points="36,1026 1364,1026" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="1040" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M01 / front-m01-adder</text></g></svg>