<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>同一个短脉冲：transport 保留，简化 inertial 抑制</title><desc>同一横轴0到8纳秒：输入在1到3纳秒为1，transport输出在4到6纳秒为1，简化inertial输出保持0。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">同一个短脉冲：transport 保留，简化 inertial 抑制</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">初始 I=O=0；输入 1 ns 上升、3 ns 下降；脉宽 w=2 ns，门延迟 d=3 ns。</text><polyline points="260,175 260,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="260" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><polyline points="365,175 365,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="365" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><polyline points="470,175 470,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="470" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">2</text><polyline points="575,175 575,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="575" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">3</text><polyline points="680,175 680,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="680" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">4</text><polyline points="785,175 785,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="785" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">5</text><polyline points="890,175 890,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="890" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">6</text><polyline points="995,175 995,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="995" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">7</text><polyline points="1100,175 1100,610" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="1100" y="625" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">8</text><text x="45" y="215" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#172b3a">输入 I</text><text x="225" y="194" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">1</text><text x="225" y="260" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">0</text><polyline points="260,270 260,270 365,270 365,200 575,200 575,270 1100,270" fill="none" stroke="#172b3a" stroke-width="4" stroke-linejoin="round" /><text x="45" y="375" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#3169b3">transport</text><text x="225" y="354" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">1</text><text x="225" y="420" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">0</text><polyline points="260,430 260,430 680,430 680,360 890,360 890,430 1100,430" fill="none" stroke="#3169b3" stroke-width="4" stroke-linejoin="round" /><text x="45" y="535" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#b66a16">inertial</text><text x="225" y="514" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">1</text><text x="225" y="580" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">0</text><polyline points="260,590 260,590 1100,590" fill="none" stroke="#b66a16" stroke-width="4" stroke-linejoin="round" /><polyline points="365,155 680,155" fill="none" stroke="#3169b3" stroke-width="3" stroke-linejoin="round" /><polygon points="680,155 670.0,150.0 670.0,160.0" fill="#3169b3"/><text x="522.5" y="115" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#3169b3">对应上升沿平移 3 ns</text><text x="550" y="290" dominant-baseline="text-before-edge" text-anchor="start" font-size="22" font-weight="400" fill="#3169b3">宽度仍为 2 ns</text><text x="640" y="465" dominant-baseline="text-before-edge" text-anchor="start" font-size="22" font-weight="400" fill="#b66a16">3 ns 撤销尚未执行的 4 ns→1</text><text x="1140" y="625" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">ns</text><rect x="60" y="680" width="1080" height="70" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="600.0" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">比较：w &lt; d 被抑制；此教学模型保留 w = d 的脉冲</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M08 / back-m08-pulse</text></g></svg>