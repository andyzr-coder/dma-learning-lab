" y="503" width="125" height="58" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="757.5" y="518.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">·</text><rect x="820" y="503" width="125" height="58" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="882.5" y="518.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">●</text><rect x="945" y="503" width="125" height="58" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1007.5" y="518.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">●</text><text x="110" y="595" dominant-baseline="text-before-edge" text-anchor="start" font-size="28" font-weight="700" fill="#23734c">方案一：P + S + T</text><text x="630" y="595" dominant-baseline="text-before-edge" text-anchor="start" font-size="28" font-weight="700" fill="#3169b3">方案二：Q + R + U</text><text x="110" y="650.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">每列至少一个 ●；没有仅出现一个 ● 的列，所以没有 EPI。</text><text x="110" y="684.5" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">每个 PI 最多盖 2 个点，要盖 6 点至少选 3 项；两方案都达下界：3 项、6 literal。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M03 / front-m03-cover</text></g></svg>