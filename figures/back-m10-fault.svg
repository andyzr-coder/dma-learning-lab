<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>一个测试向量必须同时做到：激活故障 ＋ 传播差异</title><desc>左右并排的同一AND-OR电路输入110，正常n1y1，n/0故障电路n0y0。对比111仅激活却被c1掩盖，100连激活也没有。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">一个测试向量必须同时做到：激活故障 ＋ 传播差异</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">网表 n=a AND b，y=n OR c；故障 n/0 意味着内部节点 n 永远被强制为 0。</text><text x="285" y="130" dominant-baseline="text-before-edge" text-anchor="middle" font-size="27" font-weight="700" fill="#087f8c">正常电路：abc = 110</text><text x="885" y="130" dominant-baseline="text-before-edge" text-anchor="middle" font-size="27" font-weight="700" fill="#b53d43">故障电路：abc = 110</text><rect x="170" y="255" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="217.5" y="270" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="217.5" y="303" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="400" y="320" width="90" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="445.0" y="335" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="445.0" y="368" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="40" y="245" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">a = 1</text><text x="40" y="300" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">b = 1</text><text x="40" y="430" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">c = 0</text><polyline points="115,275 170,275" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="170,275 160.0,270.0 160.0,280.0" fill="#172b3a"/><polyline points="115,320 170,320" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="170,320 160.0,315.0 160.0,325.0" fill="#172b3a"/><polyline points="265,295 340,295 340,340 400,340" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="400,340 390.0,335.0 390.0,345.0" fill="#087f8c"/><text x="282" y="248" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#087f8c">n = 1</text><polyline points="115,448 340,448 340,380 400,380" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="400,380 390.0,375.0 390.0,385.0" fill="#172b3a"/><polyline points="490,360 560,360" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="560,360 550.0,355.0 550.0,365.0" fill="#087f8c"/><text x="480" y="285" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#087f8c">y = 1</text><rect x="770" y="255" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="817.5" y="270" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="817.5" y="303" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="1000" y="320" width="90" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="1045.0" y="335" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="1045.0" y="368" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="640" y="245" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">a = 1</text><text x="640" y="300" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">b = 1</text><text x="640" y="430" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">c = 0</text><polyline points="715,275 770,275" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="770,275 760.0,270.0 760.0,280.0" fill="#172b3a"/><polyline points="715,320 770,320" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="770,320 760.0,315.0 760.0,325.0" fill="#172b3a"/><polyline points="865,295 940,295 940,340 1000,340" fill="none" stroke="#b53d43" stroke-width="3" stroke-linejoin="round" /><polygon points="1000,340 990.0,335.0 990.0,345.0" fill="#b53d43"/><text x="882" y="248" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#b53d43">n = 0</text><circle cx="915" cy="295" r="8" fill="#b53d43" stroke="#b53d43" stroke-width="2"/><text x="875" y="195" dominant-baseline="text-before-edge" text-anchor="start" font-size="21" font-weight="700" fill="#b53d43">n/0 强制为0</text><polyline points="715,448 940,448 940,380 1000,380" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1000,380 990.0,375.0 990.0,385.0" fill="#172b3a"/><polyline points="1090,360 1160,360" fill="none" stroke="#b53d43" stroke-width="3" stroke-linejoin="round" /><polygon points="1160,360 1150.0,355.0 1150.0,365.0" fill="#b53d43"/><text x="1080" y="285" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#b53d43">y = 0</text><rect x="85" y="550" width="160" height="49" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="165.0" y="562.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">输入 abc</text><rect x="245" y="550" width="200" height="49" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="345.0" y="562.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">正常 n / y</text><rect x="445" y="550" width="200" height="49" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="545.0" y="562.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">故障 n / y</text><rect x="645" y="550" width="150" height="49" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="720.0" y="562.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">是否检测</text><rect x="795" y="550" width="320" height="49" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="955.0" y="562.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">原因</text><rect x="85" y="599" width="160" height="49" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="165.0" y="611.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">110</text><rect x="245" y="599" width="200" height="49" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="345.0" y="611.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1 / 1</text><rect x="445" y="599" width="200" height="49" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="545.0" y="611.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0 / 0</text><rect x="645" y="599" width="150" height="49" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="720.0" y="611.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">是</text><rect x="795" y="599" width="320" height="49" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="955.0" y="611.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">激活，并传到输出</text><rect x="85" y="648" width="160" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="165.0" y="660.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">111</text><rect x="245" y="648" width="200" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="345.0" y="660.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1 / 1</text><rect x="445" y="648" width="200" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="545.0" y="660.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0 / 1</text><rect x="645" y="648" width="150" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="720.0" y="660.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">否</text><rect x="795" y="648" width="320" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="955.0" y="660.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">c=1 掩盖 n 差异</text><rect x="85" y="697" width="160" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="165.0" y="709.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">100</text><rect x="245" y="697" width="200" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="345.0" y="709.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0 / 0</text><rect x="445" y="697" width="200" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="545.0" y="709.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0 / 0</text><rect x="645" y="697" width="150" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="720.0" y="709.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">否</text><rect x="795" y="697" width="320" height="49" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="955.0" y="709.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">n 本来就是 0</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M10 / back-m10-fault</text></g></svg>