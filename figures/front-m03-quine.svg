<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>Quine：只能合并一个固定比特不同的 cube</title><desc>六个二进制minterm组成相邻六环，六条边标出P00–、R–01、T1–1、U11–、S–10、Q0–0。没有合法的下一轮合并。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">Quine：只能合并一个固定比特不同的 cube</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">ON = {0, 1, 2, 5, 6, 7}，OFF = {3, 4}，无 DC；“–”表示该位自由。</text><text x="50" y="130" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">六个 minterm 的相邻关系</text><polyline points="263.0,220.0 417.0,220.0" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polyline points="483.8521084376849,255.7781626565273 556.1478915623152,364.2218373434727" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polyline points="556.1478915623152,435.7781626565273 483.8521084376849,544.2218373434728" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polyline points="417.0,580.0 263.0,580.0" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polyline points="196.14789156231515,544.2218373434728 123.85210843768485,435.7781626565273" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polyline points="123.85210843768485,364.2218373434727 196.14789156231515,255.7781626565273" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><circle cx="220" cy="220" r="43" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="220" y="205" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">000</text><circle cx="460" cy="220" r="43" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="460" y="205" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">001</text><circle cx="580" cy="400" r="43" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="580" y="385" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">101</text><circle cx="460" cy="580" r="43" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="460" y="565" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">111</text><circle cx="220" cy="580" r="43" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="220" y="565" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">110</text><circle cx="100" cy="400" r="43" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="100" y="385" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">010</text><text x="340" y="163" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#087f8c">P = 00–</text><text x="565" y="285" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#087f8c">R = –01</text><text x="565" y="505" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#087f8c">T = 1–1</text><text x="340" y="620" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#087f8c">U = 11–</text><text x="90" y="505" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#087f8c">S = –10</text><text x="90" y="285" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#087f8c">Q = 0–0</text><rect x="720" y="145" width="420" height="185" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="930.0" y="161" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">一条边 → 一个 1-cube</text><text x="738" y="202.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">例：000 与 001 合并为 00–。</text><text x="738" y="232.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">只消去 c；留下 ¬a·¬b。</text><text x="738" y="262.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">覆盖点恰好是 {0, 1}。</text><rect x="720" y="365" width="420" height="240" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="930.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">下一轮为什么停止？</text><text x="738" y="422.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">00– 与 0–0 的横杠位置不同。</text><text x="738" y="452.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">不能“看着像”就并为 0––。</text><text x="738" y="482.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">0–– 会包含 OFF 点 011。</text><text x="738" y="512.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">本例 6 个 1-cube 全是 PI。</text><text x="70" y="700" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#172b3a">每轮保存未被继续合并的 cube；PI 是“不可再扩张”，还不等于最终必选。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M03 / front-m03-quine</text></g></svg>