<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>signal 与 variable：同一段顺序代码的两种更新</title><desc>左侧六行代码sa&lt;=sb、sb&lt;=sa、va:=vb、vb:=va、q&lt;=sa、r&lt;=va。右表显示进程后变量变11而信号保持01，delta后信号变10，q0r1。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">signal 与 variable：同一段顺序代码的两种更新</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">同一时钟进程；sa/sb/q/r 是 signal；va/vb 是持久局部 variable；无 after 延迟。</text><rect x="40" y="150" width="375" height="380" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="227.5" y="166" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">每个上升沿执行</text><text x="80" y="215" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#3169b3">sa &lt;= sb;</text><text x="80" y="260" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#3169b3">sb &lt;= sa;</text><text x="80" y="305" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#b66a16">va := vb;</text><text x="80" y="350" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#b66a16">vb := va;</text><text x="80" y="395" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#3169b3">q &lt;= sa;</text><text x="80" y="440" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#3169b3">r &lt;= va;</text><rect x="470" y="170" width="235" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="587.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">阶段</text><rect x="705" y="170" width="73" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="741.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">sa</text><rect x="778" y="170" width="73" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="814.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">sb</text><rect x="851" y="170" width="73" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">va</text><rect x="924" y="170" width="73" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="960.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">vb</text><rect x="997" y="170" width="73" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="1033.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">q</text><rect x="1070" y="170" width="73" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="1106.5" y="190.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="700" fill="#172b3a">r</text><rect x="470" y="235" width="235" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="587.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">第1沿之前</text><rect x="705" y="235" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="741.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="778" y="235" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="814.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="851" y="235" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="924" y="235" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="960.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="997" y="235" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1033.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="1070" y="235" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1106.5" y="255.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="470" y="300" width="235" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="587.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">进程刚执行完</text><rect x="705" y="300" width="73" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="741.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="778" y="300" width="73" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="814.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="851" y="300" width="73" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="924" y="300" width="73" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="960.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="997" y="300" width="73" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="1033.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="1070" y="300" width="73" height="65" rx="0" fill="#fff2df" stroke="#c9d6df" stroke-width="1"/><text x="1106.5" y="320.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="470" y="365" width="235" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="587.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">随后 delta 更新</text><rect x="705" y="365" width="73" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="741.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="778" y="365" width="73" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="814.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="851" y="365" width="73" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="924" y="365" width="73" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="960.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="997" y="365" width="73" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="1033.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="1070" y="365" width="73" height="65" rx="0" fill="#e3f5ed" stroke="#c9d6df" stroke-width="1"/><text x="1106.5" y="385.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="470" y="430" width="235" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="587.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">第2沿及其更新后</text><rect x="705" y="430" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="741.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">0</text><rect x="778" y="430" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="814.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="851" y="430" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="924" y="430" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="960.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="997" y="430" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1033.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><rect x="1070" y="430" width="73" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1106.5" y="450.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="23" font-weight="400" fill="#172b3a">1</text><text x="470" y="535" dominant-baseline="text-before-edge" text-anchor="start" font-size="21" font-weight="700" fill="#3169b3">第1沿的未来 signal 事务：sa←1，sb←0，q←0，r←1</text><rect x="55" y="600" width="1090" height="130" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="600.0" y="616" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">为什么 q=0，而 r=1？</text><text x="73" y="657.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">q&lt;=sa 读取当前 sa=0；sa&lt;=sb 尚未生效。r&lt;=va 读取立即更新后的 va=1。</text><text x="73" y="687.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">signal 交换 sa/sb 成功；变量依次覆盖后 va=vb=1。delta 是同一物理时刻的更新轮次，不是 1 ns。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M09 / back-m09-delta</text></g></svg>