efore-edge" text-anchor="start" font-size="22" font-weight="700" fill="#23734c">ON-set = {1, 3, 5, 6, 7}</text><text x="430" y="125" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">② 方程：f = ab + c</text><text x="650" y="180" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">③ 连接门与导线</text><rect x="720" y="265" width="100" height="84" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="770.0" y="280" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="770.0" y="313" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="960" y="330" width="100" height="84" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="1010.0" y="345" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="1010.0" y="378" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="610" y="268" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><text x="610" y="318" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><text x="610" y="450" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">c</text><polyline points="640,285 720,285" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="720,285 710.0,280.0 710.0,290.0" fill="#172b3a"/><polyline points="640,330 720,330" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="720,330 710.0,325.0 710.0,335.0" fill="#172b3a"/><polyline points="820,307 900,307 900,350 960,350" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="960,350 950.0,345.0 950.0,355.0" fill="#172b3a"/><text x="845" y="267" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#087f8c">n = ab</text><polyline points="640,468 900,468 900,395 960,395" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="960,395 950.0,390.0 950.0,400.0" fill="#172b3a"/><polyline points="1060,372 1150,372" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1150,372 1140.0,367.0 1140.0,377.0" fill="#172b3a"/><text x="1085" y="325" dominant-baseline="text-before-edge" text-anchor="start" font-size="25" font-weight="700" fill="#172b3a">f</text><rect x="430" y="550" width="720" height="170" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="790.0" y="566" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">④ 用一行核验门图</text><text x="448" y="607.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">输入 abc = 110：AND 得 n = 1；OR 得 1 OR 0 = 1。</text><text x="448" y="637.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">输入 abc = 001：AND 得 n = 0；OR 得 0 OR 1 = 1。</text><text x="448" y="667.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">把 8 行全验完，才证明此组合电路与真值表等价。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M01 / front-m01-flow</text></g></svg>