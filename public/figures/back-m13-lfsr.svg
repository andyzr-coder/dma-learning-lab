ll="#172b3a"/><rect x="60" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="125" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">0101</text><polyline points="190,712 220,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="220,712 210.0,707.0 210.0,717.0" fill="#172b3a"/><rect x="225" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="290" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">1010</text><polyline points="355,712 385,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="385,712 375.0,707.0 375.0,717.0" fill="#172b3a"/><rect x="390" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="455" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">1101</text><polyline points="520,712 550,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="550,712 540.0,707.0 540.0,717.0" fill="#172b3a"/><rect x="555" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="620" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">1110</text><polyline points="685,712 715,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="715,712 705.0,707.0 705.0,717.0" fill="#172b3a"/><rect x="720" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="785" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">1111</text><polyline points="850,712 880,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="880,712 870.0,707.0 870.0,717.0" fill="#172b3a"/><rect x="885" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="950" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">0111</text><polyline points="1015,712 1045,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1045,712 1035.0,707.0 1035.0,717.0" fill="#172b3a"/><rect x="1050" y="680" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="1115" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">0011</text><polyline points="1180,712 1210,712" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1210,712 1200.0,707.0 1200.0,717.0" fill="#172b3a"/><rect x="1215" y="680" width="130" height="65" rx="7" fill="#e3f5ed" stroke="#087f8c" stroke-width="2"/><text x="1280" y="696" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">0001</text><rect x="70" y="795" width="1260" height="120" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="700.0" y="811" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">核验与边界</text><text x="88" y="852.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">0001：s0 XOR s1 = 1，右移后成为 1000。15 个非零状态各出现一次；0000 则一直是0000。</text><text x="88" y="882.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">mask=0011 只指抽头位置。换移位方向或位编号后不能照抄这个序列。</text><polyline points="36,926 1364,926" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="940" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M13 / back-m13-lfsr</text></g></svg>