<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" role="img"><title>LFSR：明确位顺序，再数第一次重复</title><desc>四个触发器从s3向s0右移，s0和s1异或反馈到s3。完整非零序列0001、1000、0100、0010、1001、1100、0110、1011、0101、1010、1101、1110、1111、0111、0011后回0001。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="980" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1400" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">LFSR：明确位顺序，再数第一次重复</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">4 位右移，状态写成 s3 s2 s1 s0；反馈 f = s0 XOR s1；next = [f, s3, s2, s1]。</text><rect x="275" y="190" width="130" height="100" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="340.0" y="206" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">s3</text><text x="293" y="247.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">触发器</text><polyline points="405,240 505,240" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="505,240 495.0,235.0 495.0,245.0" fill="#087f8c"/><rect x="505" y="190" width="130" height="100" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="570.0" y="206" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">s2</text><text x="523" y="247.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">触发器</text><polyline points="635,240 735,240" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="735,240 725.0,235.0 725.0,245.0" fill="#087f8c"/><rect x="735" y="190" width="130" height="100" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="800.0" y="206" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">s1</text><text x="753" y="247.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">触发器</text><polyline points="865,240 965,240" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="965,240 955.0,235.0 955.0,245.0" fill="#087f8c"/><rect x="965" y="190" width="130" height="100" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="1030.0" y="206" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">s0</text><text x="983" y="247.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">触发器</text><polyline points="1095,240 1270,240" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1270,240 1260.0,235.0 1260.0,245.0" fill="#172b3a"/><text x="1170" y="190" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">输出旧 s0</text><rect x="700" y="370" width="120" height="90" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="760.0" y="385" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">XOR</text><text x="760.0" y="418" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><polyline points="800,290 800,340 780,340 780,370" fill="none" stroke="#3169b3" stroke-width="3" stroke-linejoin="round" /><polygon points="780,370 785.0,360.0 775.0,360.0" fill="#3169b3"/><circle cx="800" cy="290" r="5" fill="#3169b3" stroke="#3169b3" stroke-width="2"/><polyline points="1030,290 1030,420 820,420" fill="none" stroke="#3169b3" stroke-width="3" stroke-linejoin="round" /><polygon points="820,420 830.0,425.0 830.0,415.0" fill="#3169b3"/><circle cx="1030" cy="290" r="5" fill="#3169b3" stroke="#3169b3" stroke-width="2"/><polyline points="700,415 180,415 180,240 275,240" fill="none" stroke="#b66a16" stroke-width="3" stroke-linejoin="round" /><polygon points="275,240 265.0,235.0 265.0,245.0" fill="#b66a16"/><text x="300" y="370" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#b66a16">反馈 f；送入新的 s3</text><text x="70" y="500" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#172b3a">从 0001 开始：完整 15 态；最后箭头回到 0001</text><rect x="60" y="565" width="130" height="65" rx="7" fill="#e3f5ed" stroke="#087f8c" stroke-width="2"/><text x="125" y="581" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">0001</text><polyline points="190,597 220,597" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="220,597 210.0,592.0 210.0,602.0" fill="#172b3a"/><rect x="225" y="565" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="290" y="581" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">1000</text><polyline points="355,597 385,597" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="385,597 375.0,592.0 375.0,602.0" fill="#172b3a"/><rect x="390" y="565" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="455" y="581" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">0100</text><polyline points="520,597 550,597" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="550,597 540.0,592.0 540.0,602.0" fill="#172b3a"/><rect x="555" y="565" width="130" height="65" rx="7" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><