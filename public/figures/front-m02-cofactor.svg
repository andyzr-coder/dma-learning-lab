<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>Cofactor 与 Shannon：先固定 a，再选子函数</title><desc>左侧分别固定a为0和1得到c与b+c，接入以a为选择端的MUX；a=0选择上支，a=1选择下支。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">Cofactor 与 Shannon：先固定 a，再选子函数</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">f = ab + c；f[a=0] = c，f[a=1] = b + c。</text><rect x="55" y="145" width="420" height="145" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="265.0" y="161" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">a = 0：f0 = c</text><text x="73" y="202.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">把 a 替换为 0：0·b + c = c。</text><text x="73" y="232.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">此时 b 对输出没有影响。</text><rect x="55" y="360" width="420" height="145" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="265.0" y="376" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">a = 1：f1 = b + c</text><text x="73" y="417.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">把 a 替换为 1：1·b + c = b + c。</text><text x="73" y="447.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">此时需要 OR(b, c)。</text><rect x="720" y="230" width="180" height="250" rx="16" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="810" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">MUX</text><text x="747" y="253" dominant-baseline="text-before-edge" text-anchor="start" font-size="22" font-weight="400" fill="#172b3a">0</text><text x="747" y="430" dominant-baseline="text-before-edge" text-anchor="start" font-size="22" font-weight="400" fill="#172b3a">1</text><polyline points="475,210 600,210 600,270 720,270" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="720,270 710.0,265.0 710.0,275.0" fill="#172b3a"/><polyline points="475,430 720,430" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="720,430 710.0,425.0 710.0,435.0" fill="#172b3a"/><polyline points="810,150 810,230" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="810,230 815.0,220.0 805.0,220.0" fill="#172b3a"/><text x="840" y="160" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">选择端 a</text><polyline points="900,355 1100,355" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1100,355 1090.0,350.0 1090.0,360.0" fill="#172b3a"/><text x="1000" y="305" dominant-baseline="text-before-edge" text-anchor="start" font-size="28" font-weight="700" fill="#172b3a">f</text><rect x="55" y="575" width="1090" height="140" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="600.0" y="591" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">Shannon：f = (¬a)f0 + a f1 = (¬a)c + a(b + c)</text><text x="73" y="632.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">不是把两支直接 OR：输入 abc = 010 时，f0 = 0、f1 = 1，但 a=0，只能选 f0。</text><text x="73" y="662.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">核验：a=0 得 c；a=1 得 b+c。两种 a 值覆盖所有输入，因此等式成立。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M02 / front-m02-cofactor</text></g></svg>