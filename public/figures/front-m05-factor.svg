<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>因式分解：相同功能可以有不同门网络</title><desc>左图两个AND分别算ab和ac再进OR，共3门。右图OR先算b+c再与a进入AND，共2门。两者最长路径均为2级。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">因式分解：相同功能可以有不同门网络</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">比较 f = ab + ac 与 f = a(b + c)；只统计二输入 AND/OR 门，不计导线与扇出缓冲。</text><text x="230" y="130" dominant-baseline="text-before-edge" text-anchor="middle" font-size="28" font-weight="700" fill="#172b3a">基线：3 个门</text><text x="890" y="130" dominant-baseline="text-before-edge" text-anchor="middle" font-size="28" font-weight="700" fill="#172b3a">分解：2 个门</text><rect x="250" y="230" width="90" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="295.0" y="245" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="295.0" y="278" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="250" y="420" width="90" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="295.0" y="435" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="295.0" y="468" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="470" y="325" width="90" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="515.0" y="340" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="515.0" y="373" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="45" y="230" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><text x="45" y="285" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><text x="45" y="475" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">c</text><polyline points="75,245 150,245 150,250 250,250" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="250,250 240.0,245.0 240.0,255.0" fill="#172b3a"/><circle cx="150" cy="245" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/><polyline points="150,245 150,440 250,440" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="250,440 240.0,435.0 240.0,445.0" fill="#172b3a"/><polyline points="75,300 250,300" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="250,300 240.0,295.0 240.0,305.0" fill="#172b3a"/><polyline points="75,490 250,490" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="250,490 240.0,485.0 240.0,495.0" fill="#172b3a"/><polyline points="340,270 410,270 410,345 470,345" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="470,345 460.0,340.0 460.0,350.0" fill="#172b3a"/><polyline points="340,460 410,460 410,385 470,385" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="470,385 460.0,380.0 460.0,390.0" fill="#172b3a"/><polyline points="560,365 600,365" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="600,365 590.0,360.0 590.0,370.0" fill="#172b3a"/><text x="575" y="325" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#172b3a">f</text><rect x="800" y="340" width="95" height="80" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="847.5" y="355" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">OR</text><text x="847.5" y="388" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><rect x="1020" y="250" width="100" height="90" rx="10" fill="#edf5f7" stroke="#087f8c" stroke-width="3"/><text x="1070.0" y="265" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#087f8c">AND</text><text x="1070.0" y="298" dominant-baseline="text-before-edge" text-anchor="middle" font-size="16" font-weight="400" fill="#526676">逻辑门</text><text x="660" y="240" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">a</text><text x="660" y="345" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">b</text><text x="660" y="395" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">c</text><polyline points="690,260 1020,270" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1020,270 1010.1560338417501,264.6994028378654 1009.8531425753424,274.6948146293192" fill="#172b3a"/><polyline points="690,360 800,360" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="800,360 790.0,355.0 790.0,365.0" fill="#172b3a"/><polyline points="690,410 800,410" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="800,410 790.0,405.0 790.0,415.0" fill="#172b3a"/><polyline points="895,380 955,380 955,320 1020,320" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1020,320 1010.0,315.0 1010.0,325.0" fill="#172b3a"/><polyline points="1120,295 1170,295" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="1170,295 1160.0,290.0 1160.0,300.0" fill="#172b3a"/><text x="1135" y="250" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#172b3a">f</text><rect x="70" y="565" width="1060" height="150" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="600.0" y="581" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">省门数 ≠ 自动提高所有性能</text><text x="88" y="622.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">两种网络的最长逻辑深度都是 2 级。分解后 a→f 为 1 级，b/c→f 仍为 2 级。</text><text x="88" y="652.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">面积与时序还取决于标准单元、负载、扇出、布局布线。统一这些条件后才能作真实性能比较。</text><text x="88" y="682.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">代数核验：分配律 a(b+c)=ab+ac；再对 8 行输入复算可独立验证。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M05 / front-m05-factor</text></g></svg>