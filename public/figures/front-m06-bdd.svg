oin="round" /><text x="65" y="810" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#172b3a">蓝色虚线 = 0 分支；橙色实线 = 1 分支。非终端只数圆圈，两个方框不计入 9 / 6。</text><text x="65" y="850" dominant-baseline="text-before-edge" text-anchor="start" font-size="22" font-weight="400" fill="#172b3a">验证同一输入：a=b=c=d=1，两图均沿相应 1 分支到终端 1；abcd=0101 也得到 1。</text><polyline points="36,886 1364,886" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="900" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M06 / front-m06-bdd</text></g></svg>