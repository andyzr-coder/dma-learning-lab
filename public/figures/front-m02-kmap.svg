<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>K-map：圈的是相邻输入，留下不变变量</title><desc>两行四列K-map，a为行，bc按00、01、11、10为列。c=1的四格圈成c；a=b=1的两格圈成ab，m7重叠。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">K-map：圈的是相邻输入，留下不变变量</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">仍用 f = ab + c；列按 Gray 顺序 00、01、11、10，首尾也相邻。</text><text x="80" y="130" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">把 8 行真值表折成 2 × 4 方格</text><text x="60" y="235" dominant-baseline="text-before-edge" text-anchor="start" font-size="25" font-weight="700" fill="#172b3a">a</text><text x="205" y="178" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="400" fill="#172b3a">bc →</text><text x="240" y="225" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">00</text><text x="420" y="225" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">01</text><text x="600" y="225" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">11</text><text x="780" y="225" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">10</text><text x="100" y="310" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">0</text><rect x="160" y="285" width="160" height="120" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="2"/><text x="240" y="301" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">0</text><text x="240" y="357" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m0</text><rect x="340" y="285" width="160" height="120" rx="0" fill="#edf5f7" stroke="#c9d6df" stroke-width="2"/><text x="420" y="301" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">1</text><text x="420" y="357" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m1</text><rect x="520" y="285" width="160" height="120" rx="0" fill="#edf5f7" stroke="#c9d6df" stroke-width="2"/><text x="600" y="301" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">1</text><text x="600" y="357" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m3</text><rect x="700" y="285" width="160" height="120" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="2"/><text x="780" y="301" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">0</text><text x="780" y="357" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m2</text><text x="100" y="450" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">1</text><rect x="160" y="425" width="160" height="120" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="2"/><text x="240" y="441" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">0</text><text x="240" y="497" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m4</text><rect x="340" y="425" width="160" height="120" rx="0" fill="#edf5f7" stroke="#c9d6df" stroke-width="2"/><text x="420" y="441" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">1</text><text x="420" y="497" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m5</text><rect x="520" y="425" width="160" height="120" rx="0" fill="#edf5f7" stroke="#c9d6df" stroke-width="2"/><text x="600" y="441" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">1</text><text x="600" y="497" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m7</text><rect x="700" y="425" width="160" height="120" rx="0" fill="#edf5f7" stroke="#c9d6df" stroke-width="2"/><text x="780" y="441" dominant-baseline="text-before-edge" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3a">1</text><text x="780" y="497" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" font-weight="400" fill="#526676">m6</text><rect x="345" y="275" width="350" height="280" rx="18" fill="none" stroke="#087f8c" stroke-width="5"/><rect x="515" y="415" width="350" height="140" rx="18" fill="none" stroke="#b66a16" stroke-width="5"/><text x="920" y="295" dominant-baseline="text-before-edge" text-anchor="start" font-size="25" font-weight="700" fill="#087f8c">青色 4 格 → c</text><text x="920" y="342.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">a、b 都变化</text><text x="920" y="372.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">只有 c = 1 不变</text><text x="920" y="440" dominant-baseline="text-before-edge" text-anchor="start" font-size="25" font-weight="700" fill="#b66a16">橙色 2 格 → ab</text><text x="920" y="487.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">c 变化</text><text x="920" y="517.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">a = b = 1 不变</text><rect x="80" y="600" width="1040" height="130" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="600.0" y="616" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">f = c + ab</text><text x="98" y="657.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">允许重叠：m7 同时在两圈里。每圈大小必须是 1、2、4、8…；只能圈 1 或获准的 DC。</text><text x="98" y="687.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">对角线接触不算相邻；此图没有 DC。圈外的 0 不能被覆盖。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M02 / front-m02-kmap</text></g></svg>