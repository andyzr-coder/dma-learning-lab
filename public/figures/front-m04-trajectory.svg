<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>启发式局部操作：每一步都检查当前 cover</title><desc>四个cover依次abc+ab¬c+¬abc、ab+ab¬c+¬abc、ab+¬abc、ab+bc，literal数量9、8、5、4。每次扩张只新增既有ON点。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">启发式局部操作：每一步都检查当前 cover</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">固定 ON = {3, 6, 7}；只用教学示例说明 expand / remove，不宣称运行完整 Espresso。</text><rect x="35" y="170" width="255" height="310" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="162.5" y="186" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">1. 原 cover</text><text x="163" y="250" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">abc</text><text x="163" y="302" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">ab¬c</text><text x="163" y="354" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">¬abc</text><text x="163" y="428" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#b66a16">9 literal</text><polyline points="295,325 325,325" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="325,325 315.0,320.0 315.0,330.0" fill="#172b3a"/><rect x="330" y="170" width="255" height="310" rx="12" fill="#edf5f7" stroke="#3169b3" stroke-width="2"/><text x="457.5" y="186" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#3169b3">2. 扩张 abc → ab</text><text x="458" y="250" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">ab</text><text x="458" y="302" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">ab¬c</text><text x="458" y="354" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">¬abc</text><text x="458" y="428" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#b66a16">8 literal</text><polyline points="590,325 620,325" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="620,325 610.0,320.0 610.0,330.0" fill="#172b3a"/><rect x="625" y="170" width="255" height="310" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="752.5" y="186" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">3. 删除冗余 ab¬c</text><text x="753" y="250" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">ab</text><text x="753" y="302" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">¬abc</text><text x="753" y="428" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#b66a16">5 literal</text><polyline points="885,325 915,325" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="915,325 905.0,320.0 905.0,330.0" fill="#172b3a"/><rect x="920" y="170" width="255" height="310" rx="12" fill="#edf5f7" stroke="#3169b3" stroke-width="2"/><text x="1047.5" y="186" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#3169b3">4. 扩张 ¬abc → bc</text><text x="1048" y="250" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">ab</text><text x="1048" y="302" dominant-baseline="text-before-edge" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3a">bc</text><text x="1048" y="428" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#b66a16">4 literal</text><rect x="55" y="530" width="1090" height="185" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="600.0" y="546" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">为什么合法？看新增或失去的点</text><text x="73" y="587.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">① abc→ab 只新增 110；它本来就在 ON 中。</text><text x="73" y="617.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">② 删除 ab¬c 后，110 仍被 ab 覆盖，所以 ON 不丢失。</text><text x="73" y="647.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">③ ¬abc→bc 只新增 111；仍在 ON 中。最后 f=ab+bc，真值没有改变。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M04 / front-m04-trajectory</text></g></svg>