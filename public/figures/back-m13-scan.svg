line="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">8</text><text x="630.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="660" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="690.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">9</text><text x="690.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="720" y="365" width="60" height="60" rx="0" fill="#fff1dd" stroke="#ffffff" stroke-width="2"/><text x="750.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">10</text><text x="750.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">C</text><rect x="780" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="810.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">11</text><text x="810.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="840" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="870.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">12</text><text x="870.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="900" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="930.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">13</text><text x="930.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="960" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="990.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">14</text><text x="990.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="1020" y="365" width="60" height="60" rx="0" fill="#fff1dd" stroke="#ffffff" stroke-width="2"/><text x="1050.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">15</text><text x="1050.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">C</text><rect x="1080" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="1110.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">16</text><text x="1110.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="1140" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="1170.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">17</text><text x="1170.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="1200" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="1230.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">18</text><text x="1230.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="1260" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="1290.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">19</text><text x="1290.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><text x="70" y="450" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#172b3a">S = shift：移位/采样；C = capture：捕获响应。每个小格都占 1 拍。</text><rect x="75" y="505" width="200" height="38" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="512.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="700" fill="#172b3a">区段 / 拍</text><rect x="275" y="505" width="500" height="38" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="512.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="700" fill="#172b3a">输入或捕获</text><rect x="775" y="505" width="550" height="38" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="512.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="700" fill="#172b3a">同时输出或说明</text><rect x="75" y="543" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="550.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">1–4</text><rect x="275" y="543" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="550.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">装入 P1=1010</text><rect x="775" y="543" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="550.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">忽略初态输出</text><rect x="75" y="581" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="588.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">5</text><rect x="275" y="581" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="588.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">capture：R1=0101</text><rect x="775" y="581" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="588.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">教学功能 Q←NOT Q</text><rect x="75" y="619" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="626.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">6–9</text><rect x="275" y="619" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="626.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">装入 P2=0011</text><rect x="775" y="619" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="626.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">同时卸 R1=0101</text><rect x="75" y="657" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="664.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">10</text><rect x="275" y="657" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="664.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">capture：R2=1100</text><rect x="775" y="657" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="664.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">教学功能 Q←NOT Q</text><rect x="75" y="695" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="702.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">11–14</text><rect x="275" y="695" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="702.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">装入 P3=1110</text><rect x="775" y="695" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="702.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">同时卸 R2=1100</text><rect x="75" y="733" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="740.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">15</text><rect x="275" y="733" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="740.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">capture：R3=0001</text><rect x="775" y="733" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="740.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">教学功能 Q←NOT Q</text><rect x="75" y="771" width="200" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="175.0" y="778.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">16–19</text><rect x="275" y="771" width="500" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="525.0" y="778.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">装入填充0</text><rect x="775" y="771" width="550" height="38" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1050.0" y="778.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="22" font-weight="400" fill="#172b3a">最后卸 R3=0001</text><text x="75" y="835" dominant-baseline="text-before-edge" text-anchor="start" font-size="27" font-weight="700" fill="#087f8c">重叠：N(P+1)+P = 4×4+3 = 19 拍；不重叠：(2N+1)P = 9×3 = 27 拍。</text><text x="75" y="880" dominant-baseline="text-before-edge" text-anchor="start" font-size="22" font-weight="400" fill="#172b3a">装 P1=1010 时串行输入顺序是 0、1、0、1；响应文字按 Q3Q2Q1Q0 写，线上旧 Q0 先出。</text><polyline points="36,906 1364,906" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="920" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M13 / back-m13-scan</text></g></svg>