<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" role="img"><title>Scan 时间账本：边卸旧响应，边装新向量</title><desc>扫描链Q3到Q0右移，共19拍：1至4装P1，5捕获R1，6至9出R1入P2，10捕R2，11至14出R2入P3，15捕R3，16至19末次卸R3。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="960" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1400" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">Scan 时间账本：边卸旧响应，边装新向量</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">4 个扫描触发器，3 组测试，每组 1 拍 capture；共用一条链，不计模式切换开销。</text><text x="50" y="130" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#172b3a">一条链同时搬两份信息</text><rect x="300" y="180" width="110" height="85" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="355.0" y="196" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">Q3</text><polyline points="410,223 520,223" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="520,223 510.0,218.0 510.0,228.0" fill="#087f8c"/><rect x="520" y="180" width="110" height="85" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="575.0" y="196" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">Q2</text><polyline points="630,223 740,223" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="740,223 730.0,218.0 730.0,228.0" fill="#087f8c"/><rect x="740" y="180" width="110" height="85" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="795.0" y="196" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">Q1</text><polyline points="850,223 960,223" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="960,223 950.0,218.0 950.0,228.0" fill="#087f8c"/><rect x="960" y="180" width="110" height="85" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="1015.0" y="196" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">Q0</text><polyline points="100,223 300,223" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="300,223 290.0,218.0 290.0,228.0" fill="#087f8c"/><text x="90" y="175" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">scan_in</text><polyline points="1070,223 1290,223" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" /><polygon points="1290,223 1280.0,218.0 1280.0,228.0" fill="#087f8c"/><text x="1150" y="175" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="400" fill="#172b3a">旧 Q0 输出</text><text x="70" y="320" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" font-weight="700" fill="#172b3a">时钟拍</text><rect x="180" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="210.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">1</text><text x="210.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="240" y="365" width="60" height="60" rx="0" fill="#def1e8" stroke="#ffffff" stroke-width="2"/><text x="270.0" y="330" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">2</text><text x="270.0" y="381" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">S</text><rect x="300" y="365" width="