<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>函数分解：先把相同余函数分成一类</title><desc>固定bc为00、01、10、11后，关于a的余函数依次为0、a、a、a；分为两类，编码z取0、1、1、1，即z=b+c，最后f=az。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">函数分解：先把相同余函数分成一类</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">f = ab + ac；绑定变量 X=(b,c)，自由变量 Y=a。不是仅按相同输出值分组。</text><rect x="100" y="155" width="240" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="220.0" y="174.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">固定 bc</text><rect x="340" y="155" width="190" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="435.0" y="174.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">00</text><rect x="530" y="155" width="190" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="625.0" y="174.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">01</text><rect x="720" y="155" width="190" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="815.0" y="174.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">10</text><rect x="910" y="155" width="190" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="1005.0" y="174.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="700" fill="#172b3a">11</text><rect x="100" y="220" width="240" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="220.0" y="239.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">剩余 a 函数</text><rect x="340" y="220" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="435.0" y="239.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">0</text><rect x="530" y="220" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="625.0" y="239.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">a</text><rect x="720" y="220" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="815.0" y="239.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">a</text><rect x="910" y="220" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1005.0" y="239.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">a</text><rect x="100" y="285" width="240" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="220.0" y="304.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">所属类别</text><rect x="340" y="285" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="435.0" y="304.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">类0</text><rect x="530" y="285" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="625.0" y="304.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">类1</text><rect x="720" y="285" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="815.0" y="304.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">类1</text><rect x="910" y="285" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1005.0" y="304.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">类1</text><rect x="100" y="350" width="240" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="220.0" y="369.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">编码 z</text><rect x="340" y="350" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="435.0" y="369.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">0</text><rect x="530" y="350" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="625.0" y="369.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">1</text><rect x="720" y="350" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="815.0" y="369.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">1</text><rect x="910" y="350" width="190" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1005.0" y="369.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="25" font-weight="400" fill="#172b3a">1</text><rect x="80" y="470" width="470" height="170" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="315.0" y="486" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">两种不同的余函数</text><text x="98" y="527.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">类0：恒为 0。类1：返回 a。</text><text x="98" y="557.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">所以 μ=2，至少需要 1 个编码位。</text><text x="98" y="587.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">取 z=b+c，刚好区分类0/类1。</text><rect x="660" y="470" width="460" height="170" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="890.0" y="486" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">再组合：f = a·z</text><text x="678" y="527.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">z=0 时，f=0。</text><text x="678" y="557.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">z=1 时，f=a。</text><text x="678" y="587.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">两类均匹配表，因此分解成立。</text><polyline points="550,550 660,550" fill="none" stroke="#172b3a" stroke-width="3" stroke-linejoin="round" /><polygon points="660,550 650.0,545.0 650.0,555.0" fill="#172b3a"/><text x="80" y="690" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#172b3a">边界：若余函数有 3 类，需要至少 2 位；不同分区可能改变类数与实现成本。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M05 / front-m05-decomposition</text></g></svg>