<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img"><title>Y-chart：三个观察域 × 五个抽象层级</title><desc>Y形三轴分别为行为、结构、物理；五个同心层从内到外为电路、逻辑、RT、算法、系统。右表给每个层级在三个域中的典型对象。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1400" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">Y-chart：三个观察域 × 五个抽象层级</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">按 L25 Introduction 印刷 pp.5–6 / PDF pp.9–10 的机制原创重绘；外圈更抽象，向中心逐步细化。</text><circle cx="330" cy="440" r="75" fill="none" stroke="#c9d6df" stroke-width="2"/><circle cx="330" cy="440" r="120" fill="none" stroke="#c9d6df" stroke-width="2"/><circle cx="330" cy="440" r="165" fill="none" stroke="#c9d6df" stroke-width="2"/><circle cx="330" cy="440" r="210" fill="none" stroke="#c9d6df" stroke-width="2"/><circle cx="330" cy="440" r="255" fill="none" stroke="#c9d6df" stroke-width="2"/><polyline points="330,440 75,185" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polygon points="75,185 78.53553390593274,195.6066017177982 85.60660171779821,188.53553390593274" fill="#087f8c"/><polyline points="330,440 585,185" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polygon points="585,185 574.3933982822017,188.53553390593274 581.4644660940672,195.6066017177982" fill="#087f8c"/><polyline points="330,440 330,765" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" /><polygon points="330,765 335.0,755.0 325.0,755.0" fill="#087f8c"/><text x="45" y="130" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#087f8c">行为域：做什么？</text><text x="395" y="130" dominant-baseline="text-before-edge" text-anchor="start" font-size="26" font-weight="700" fill="#087f8c">结构域：怎样连接？</text><text x="330" y="785" dominant-baseline="text-before-edge" text-anchor="middle" font-size="26" font-weight="700" fill="#087f8c">物理域：放在哪里？</text><circle cx="330" cy="515" r="18" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="330" y="501" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">1</text><circle cx="330" cy="560" r="18" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="330" y="546" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">2</text><circle cx="330" cy="605" r="18" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="330" y="591" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">3</text><circle cx="330" cy="650" r="18" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="330" y="636" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">4</text><circle cx="330" cy="695" r="18" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="330" y="681" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">5</text><circle cx="330" cy="440" r="8" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="650" y="190" width="150" height="72" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="725.0" y="214.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">层级</text><rect x="800" y="190" width="175" height="72" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="214.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">行为</text><rect x="975" y="190" width="205" height="72" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="1077.5" y="214.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">结构</text><rect x="1180" y="190" width="165" height="72" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="1262.5" y="214.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">物理</text><rect x="650" y="262" width="150" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="725.0" y="286.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">5 系统</text><rect x="800" y="262" width="175" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="286.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">系统规格</text><rect x="975" y="262" width="205" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1077.5" y="286.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">CPU / 存储器</text><rect x="1180" y="262" width="165" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1262.5" y="286.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">芯片 / 板</text><rect x="650" y="334" width="150" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="725.0" y="358.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">4 算法</text><rect x="800" y="334" width="175" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="358.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">算法</text><rect x="975" y="334" width="205" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1077.5" y="358.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">处理器 / 子系统</text><rect x="1180" y="334" width="165" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1262.5" y="358.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">块 / 芯片</text><rect x="650" y="406" width="150" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="725.0" y="430.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">3 RT</text><rect x="800" y="406" width="175" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="430.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">寄存器传输</text><rect x="975" y="406" width="205" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1077.5" y="430.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">ALU / 寄存器</text><rect x="1180" y="406" width="165" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1262.5" y="430.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">宏单元</text><rect x="650" y="478" width="150" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="725.0" y="502.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">2 逻辑</text><rect x="800" y="478" width="175" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="502.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">布尔方程</text><rect x="975" y="478" width="205" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1077.5" y="502.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">门 / 触发器</text><rect x="1180" y="478" width="165" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1262.5" y="502.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">单元布局</text><rect x="650" y="550" width="150" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="725.0" y="574.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">1 电路</text><rect x="800" y="550" width="175" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="887.5" y="574.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">微分方程</text><rect x="975" y="550" width="205" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1077.5" y="574.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">晶体管</text><rect x="1180" y="550" width="165" height="72" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1262.5" y="574.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">掩模多边形</text><rect x="650" y="670" width="695" height="170" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="997.5" y="686" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">域与层级不是同一个维度</text><text x="668" y="727.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">逻辑层的同一个设计，可以同时有：</text><text x="668" y="757.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">① 布尔方程 ② 门级网表 ③ 单元与连线布局。</text><text x="668" y="787.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">综合/分析可以跨域；细化/抽象可以跨层。</text><text x="70" y="890" dominant-baseline="text-before-edge" text-anchor="start" font-size="24" font-weight="700" fill="#172b3a">图上的轴不是流水线步骤；“结构域”也不等于“低抽象层”。实际设计会反复验证与反馈。</text><polyline points="36,946 1364,946" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="960" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M01 / front-m01-ychart</text></g></svg>