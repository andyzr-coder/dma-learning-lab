ke="#c9d6df" stroke-width="1"/><text x="605.0" y="371.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">0</text><rect x="645" y="350" width="370" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="830.0" y="371.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">撤销4→1，队列空</text><rect x="1015" y="350" width="80" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1055.0" y="371.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">0</text><rect x="45" y="415" width="90" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="90.0" y="436.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">4</text><rect x="135" y="415" width="160" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="215.0" y="436.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">无</text><rect x="295" y="415" width="270" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="430.0" y="436.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">6→0</text><rect x="565" y="415" width="80" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="605.0" y="436.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">1</text><rect x="645" y="415" width="370" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="830.0" y="436.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">空</text><rect x="1015" y="415" width="80" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1055.0" y="436.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">0</text><rect x="45" y="480" width="90" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="90.0" y="501.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">6</text><rect x="135" y="480" width="160" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="215.0" y="501.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">无</text><rect x="295" y="480" width="270" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="430.0" y="501.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">空</text><rect x="565" y="480" width="80" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="605.0" y="501.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">0</text><rect x="645" y="480" width="370" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="830.0" y="501.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">空</text><rect x="1015" y="480" width="80" height="65" rx="0" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="1055.0" y="501.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="400" fill="#172b3a">0</text><rect x="60" y="585" width="510" height="130" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="315.0" y="601" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">1 ns：排队，不是立刻输出</text><text x="78" y="642.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">两种模型都只安排未来 4→1。</text><text x="78" y="672.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">当前输出仍为 0，队列占用为 1。</text><rect x="630" y="585" width="510" height="130" rx="12" fill="#edf5f7" stroke="#087f8c" stroke-width="2"/><text x="885.0" y="601" dominant-baseline="text-before-edge" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">3 ns：两种队列开始分叉</text><text x="648" y="642.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">transport 留 4→1，再加 6→0。</text><text x="648" y="672.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" font-weight="400" fill="#172b3a">inertial 撤销上升，同值 0 事务省略。</text><polyline points="36,766 1164,766" fill="none" stroke="#c9d6df" stroke-width="1" stroke-linejoin="round" /><text x="36" y="780" dominant-baseline="text-before-edge" text-anchor="start" font-size="15" font-weight="400" fill="#526676">原创教学图 · 据课程机制重新构造 · M08 / back-m08-queue</text></g></svg>