<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img"><title>事件账本：安排未来事务 ≠ 输出现在改变</title><desc>队列表列出0、1、3、4、6纳秒处理后状态：transport在3纳秒队列为4→1和6→0，inertial则撤销4→1。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="95" rx="0" fill="#e7f2f4" stroke="none" stroke-width="2"/><text x="36" y="22" dominant-baseline="text-before-edge" text-anchor="start" font-size="32" font-weight="700" fill="#172b3a">事件账本：安排未来事务 ≠ 输出现在改变</text><text x="38" y="66" dominant-baseline="text-before-edge" text-anchor="start" font-size="18" font-weight="400" fill="#526676">表内状态为处理该时刻事件之后；“4→1”表示在 4 ns 执行赋值 1。</text><rect x="45" y="155" width="90" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="90.0" y="176.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">t / ns</text><rect x="135" y="155" width="160" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="215.0" y="176.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">输入变化</text><rect x="295" y="155" width="270" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="430.0" y="176.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">transport 队列</text><rect x="565" y="155" width="80" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="605.0" y="176.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill="#172b3a">输出</text><rect x="645" y="155" width="370" height="65" rx="0" fill="#dfedf0" stroke="#c9d6df" stroke-width="1"/><text x="830.0" y="176.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" font-weight="700" fill=